envSchema:
  # ---------------------------------------------------------------------------
  # Local-optimized schema (packaged as the "-local" variant).
  # Ports are published on the host; sensible localhost defaults keep local
  # deployment low-friction. Secrets still have no default and are masked.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Common
  # ---------------------------------------------------------------------------
  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  - name: ASPNETCORE_ENVIRONMENT
    label: ASP.NET Core Environment
    description: "Runtime environment for the .NET backend."
    type: text
    required: true
    default: Development

  - name: OTLP_ENDPOINT
    label: OpenTelemetry OTLP Endpoint
    description: "Endpoint where telemetry data is exported."
    type: text
    required: true
    default: http://gaeco-monitor-aspire:18889

  # ---------------------------------------------------------------------------
  # Host Port Bindings (local only)
  # ---------------------------------------------------------------------------
  - name: ONTOLOGY_POSTGRES_OUTERPORT
    label: Ontology Postgres Host Port
    description: "Host port published for the Ontology Service PostgreSQL instance."
    type: text
    required: true
    default: 5025

  - name: ONTOLOGY_SERVER_OUTERPORT
    label: Ontology Server Host Port
    description: "Host port published for the Ontology Service server."
    type: text
    required: true
    default: 5023

  # ---------------------------------------------------------------------------
  # External Service Hostnames (local: localhost:port)
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_SERVER_HOSTNAME
    label: Keycloak Server Hostname
    description: "Hostname (and optional port) used to reach the Keycloak server."
    type: text
    required: true
    default: localhost:9345

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_REALM
    label: Keycloak Realm
    description: "Keycloak realm used for authentication."
    type: text
    required: true
    default: gaeco

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  - name: KAFKA_ADDRESS
    label: Kafka Address
    description: "Kafka bootstrap server address (network alias on gaeco-network)."
    type: text
    required: true
    default: gaeco-broker:29092

  - name: KAFKA_AUTO_OFFSET_RESET
    label: Kafka Auto Offset Reset
    description: "Consumer offset reset policy when no initial offset exists."
    type: text
    required: true
    default: Earliest

  - name: KAFKA_SESSION_TIMEOUT_MS
    label: Kafka Session Timeout (ms)
    description: "Timeout in milliseconds used to detect consumer failures."
    type: text
    required: true
    default: 150000

  - name: KAFKA_MAX_POLL_INTERVAL_MS
    label: Kafka Max Poll Interval (ms)
    description: "Maximum allowed delay between consumer poll calls in milliseconds."
    type: text
    required: true
    default: 1500000

  - name: KAFKA_TOPICS_ONTOLOGY
    label: Kafka Topic (Ontology)
    description: "Kafka topic for ontology upload events."
    type: text
    required: true
    default: ekkodale.gaeco.ontology.public.uploaded

  # ---------------------------------------------------------------------------
  # Minio (Object Storage)
  # ---------------------------------------------------------------------------
  - name: MINIO_ADDRESS
    label: Minio Address
    description: "Address of the Minio instance (network alias on gaeco-network)."
    type: text
    required: true
    default: gaeco-minio:9000

  - name: MINIO_ROOT_USER
    label: Minio Root User
    description: "Root user / access key for Minio."
    type: text
    required: true
    default: minioadmin

  - name: MINIO_ROOT_PASSWORD
    label: Minio Root Password
    description: "Root password / secret key for Minio."
    type: password
    required: true
    default: minioadmin  

  # ---------------------------------------------------------------------------
  # Ontology Service
  # ---------------------------------------------------------------------------
  - name: ONTOLOGY_SERVER_HOSTNAME
    label: Ontology Server Hostname
    description: "Hostname under which the Ontology Service server is reachable (used for Traefik routing)."
    type: text
    required: true
    default: localhost:5023

  - name: ALLOWED_CORS_ORIGIN
    label: Allowed CORS Origin
    description: "Origin URL allowed to make cross-origin requests to the Ontology Service API."
    type: text
    required: true
    default: http://localhost:5000

  - name: ONTOLOGY_POSTGRES_USER
    label: Ontology Postgres User
    description: "Database user for the Ontology Service PostgreSQL instance."
    type: text
    required: true
    default: OntologyService

  - name: ONTOLOGY_POSTGRES_DATABASE
    label: Ontology Postgres Database
    description: "Database name for the Ontology Service PostgreSQL instance."
    type: text
    required: true
    default: OntologyServiceDB
  
  - name: ONTOLOGY_POSTGRES_PASSWORD
    label: Ontology Postgres Password
    description: "Database password for the Ontology Service PostgreSQL instance."
    type: password
    required: true
    default: ontology-local-pw
